[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-failure-instrumentation"
version = "0.2.0"
description = "Attribute the pytest failures that leave no trace: internal errors, and xdist worker deaths, stalls and collection mismatches"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Heknon" }]
keywords = ["pytest", "xdist", "crash", "oom", "observability", "instrumentation"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
# pydantic types the incident payload. It is imported on the controller
# only, and only when xdist is active - a worker never loads it, so the
# per-test path stays what it was.
dependencies = ["pytest>=7.0", "pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest-xdist>=3.0"]
# Only ever an upgrade: memory figures on macOS and Windows are better with it,
# and every probe degrades to a declared "unavailable" without it.
psutil = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/Heknon/pytest-failure-instrumentation"
Issues = "https://github.com/Heknon/pytest-failure-instrumentation/issues"
Changelog = "https://github.com/Heknon/pytest-failure-instrumentation/releases"

[project.entry-points.pytest11]
failure_instrumentation = "pytest_failure_instrumentation.plugin"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561. The payload is the product here - a consumer writing
# `incident: WorkerDeathIncident` against registry.parse() gets Any without
# this file, which is the opposite of what a typed union is for.
[tool.setuptools.package-data]
pytest_failure_instrumentation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The integration tests wedge a worker on purpose. Each bounds its own inner
# run (see tests/conftest.py), and this is the backstop for anything that gets
# past that - an unbounded hang in CI costs the whole 25-minute job.
faulthandler_timeout = 900
filterwarnings = [
    # This plugin only ever warns when it has given up on something. In its own
    # suite that is a failure, except where a test asks for it on purpose.
    "error::pytest_failure_instrumentation.config.FailureInstrumentationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "W"]
ignore = [
    # The alert text is the product, and several of these strings are the
    # sentences a reader sees. Wrapping them to satisfy a linter makes them
    # harder to grep for than to read.
    "E501",
    # `X | None` over `Optional[X]`. Correct from 3.10, and wrong here: these
    # are pydantic fields, and pydantic evaluates the annotation at class
    # creation. On 3.9 - which this package supports and CI runs - evaluating
    # `int | None` raises TypeError, so the model cannot be defined at all.
    # `from __future__ import annotations` defers the evaluation; it does not
    # remove it.
    "UP007",
    "UP045",
]

[tool.mypy]
python_version = "3.9"
files = ["src"]
ignore_missing_imports = true
