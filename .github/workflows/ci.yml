name: CI

on:
  push:
    # master is the default branch here; main is kept in case it is ever
    # renamed. Without the default branch listed, the one push that most
    # needs a green tick is the one that gets none.
    branches: [master, main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Cheap, and it fails first. The source carries `# noqa` and `# type:
    # ignore` markers, which are only worth writing if something checks them.
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Pinned. Unpinned, a release of either turns this gate red with no
          # change to the code, and - worse - it drifts from whatever the
          # person making the change has locally. Both happened: CI's mypy was
          # two majors ahead and rejected a python_version the local one
          # accepted. Bump these deliberately.
          pip install -e ".[test]" ruff==0.15.8 mypy==2.3.1

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy

  test:
    # The probes are platform code - procfs, psapi, waitid, GetExitCodeProcess,
    # cgroup counters - and the Windows and macOS paths cannot be exercised on
    # a Linux runner at all. That is the whole reason this matrix exists.
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # setup-python has no 3.9 build for the arm64 macOS runners, and the
          # x86_64 macos-13 runners that had one are retired - a job asking for
          # them queues forever. 3.9 is covered on Linux and Windows.
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The ordinary install. psutil is a hard dependency, so it arrives with
      # everything else; the capabilities dump below records what this
      # particular runner can actually measure, since that varies by platform
      # even when every dependency is present.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # py-spy is how this package reads any live process, the one doing the
      # reading included, so without it every test covering the live view's
      # whole reason to exist skips - which is the same as not having it.
      # Installed everywhere the platform table claims that read works, so the
      # table is checked rather than asserted: Linux and Windows say yes,
      # macOS says root only and is left out, since granting that would mean
      # running the whole suite as root.
      - name: Install the external stack reader
        if: runner.os != 'macOS'
        run: pip install -e ".[stacks]"

      # The restrictive setting, on purpose. Ubuntu and Debian ship
      # ptrace_scope=1, which is what makes a worker unreadable by a reader
      # that is its sibling rather than its ancestor, and a process unreadable
      # by the py-spy it spawns for itself - so a runner left at 0 would pass
      # the live-view tests without ever exercising either exception that
      # makes them work on a real user's machine. Set here rather than
      # assumed, and the tests report the value they observed either way.
      - name: Restrict ptrace the way a stock Linux box does
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=1
          cat /proc/sys/kernel/yama/ptrace_scope

      - name: Show what this machine can measure
        run: |
          python -c "import json; from pytest_failure_instrumentation import probes; print(json.dumps(probes.capabilities(), indent=2))"

      # -n 4 on Linux, and only there. Measured on a 4-vCPU Linux box, which is
      # the shape of this runner: 596s serially against 268s under -n 4, with
      # the same 406 passed, the same 12 skipped, and the same skip reasons
      # both ways. 4 rather than auto, because 4 is the number that comparison
      # was made with. macOS and Windows stay serial - the suite spends nearly
      # all of its time in subprocesses it starts itself, several of which are
      # xdist runs of their own with timeouts on them, and how a 4x
      # oversubscribed runner handles that has not been measured there.
      #
      # Running it parallel somewhere is the point: the reason -n was unusable
      # until now was that inner runs inherited PYTEST_XDIST_WORKER from the
      # outer one, and nothing in CI would have noticed it come back.
      # oldest-supported, without-xdist and wheel below all run the suite in
      # one process, so an ordering bug between two tests still has three
      # places to show itself.
      - name: Test
        run: pytest -q ${{ runner.os == 'Linux' && '-n 4' || '' }}

  oldest-supported:
    # pyproject declares pytest>=7.0 and python>=3.9. Everything else in this
    # workflow installs whatever is newest, so the floor is a claim nothing
    # runs - and a hook signature or an ini type that only exists in a later
    # pytest would pass every job here and fail on a user's pinned one.
    name: ubuntu / oldest supported
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install the declared minimums
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pytest==7.0.1" "pytest-xdist==3.0.2"

      - name: Test
        run: pytest -q

  without-xdist:
    # Two of the five kinds are not distributed problems, and the plugin has to
    # register without xdist installed - where pytest_testnodedown has no
    # hookspec at all, and an unspecced hookimpl is a registration error.
    name: ubuntu / no xdist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install without pytest-xdist
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test
        run: pytest -q

  wheel:
    # The one thing no other job here can see. Every one of them installs the
    # source tree, so a test that reads a file from beside the package - or a
    # file the wheel does not ship at all - passes on a checkout and fails
    # only once a release is already running. That is what happened to v0.2.0:
    # it built, failed every verify cell, and never published.
    #
    # This is release.yml's verify job on a single cell, moved to push time.
    # Keep the two in step: what is worth checking at the tag is worth knowing
    # before the tag exists.
    name: ubuntu / built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel, not the checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$(ls dist/*.whl)" pytest-xdist

      - name: Confirm it is the wheel under test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'CHECK'
          import pytest_failure_instrumentation as package

          located = package.__file__.replace("\\", "/")
          assert "site-packages" in located, f"tested the checkout, not the wheel: {located}"
          print("installed from:", located)
          CHECK

      - name: Test
        run: pytest -q
