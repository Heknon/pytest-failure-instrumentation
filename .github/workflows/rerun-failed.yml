name: Rerun failed tests

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: rerun-failed-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci-rerun-failed ')
    name: Validate rerun request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      artifact_name: ${{ steps.command.outputs.artifact_name }}
      head_sha: ${{ steps.command.outputs.head_sha }}
      platform: ${{ steps.command.outputs.platform }}
      python_version: ${{ steps.command.outputs.python_version }}
      run_id: ${{ steps.command.outputs.run_id }}
      runner: ${{ steps.command.outputs.runner }}

    steps:
      - name: Authorize and validate command
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const association = context.payload.comment.author_association;
            if (!trusted.has(association)) {
              core.setFailed(`${context.actor} is not authorized to trigger a paid runner`);
              return;
            }

            const command = context.payload.comment.body.trim();
            const match = command.match(/^\/ci-rerun-failed run=(\d+) platform=(macos|windows) python=(3\.11|3\.13)$/);
            if (!match) {
              core.setFailed('Expected: /ci-rerun-failed run=<id> platform=<macos|windows> python=<3.11|3.13>');
              return;
            }

            const [, runId, platform, pythonVersion] = match;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(runId)});
            if (source.data.conclusion !== 'failure') {
              core.setFailed(`Source run ${runId} concluded ${source.data.conclusion}, not failure`);
              return;
            }

            const osName = platform === 'macos' ? 'macOS' : 'Windows';
            const artifactName = `failed-tests-${osName}-py${pythonVersion}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: Number(runId), per_page: 100,
            });
            if (!artifacts.some(artifact => artifact.name === artifactName && !artifact.expired)) {
              core.setFailed(`Run ${runId} has no live ${artifactName} artifact`);
              return;
            }

            const pull = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            core.setOutput('artifact_name', artifactName);
            core.setOutput('head_sha', pull.data.head.sha);
            core.setOutput('platform', platform);
            core.setOutput('python_version', pythonVersion);
            core.setOutput('run_id', runId);
            core.setOutput('runner', platform === 'macos' ? 'macos-latest' : 'windows-latest');

  rerun:
    needs: prepare
    name: targeted rerun / ${{ needs.prepare.outputs.platform }} / py${{ needs.prepare.outputs.python_version }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.prepare.outputs.python_version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Download failures from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .prior-failures
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run only recorded failures
        id: tests
        env:
          TARGET_TESTS_FILE: .prior-failures/failed-tests.txt
        run: python .github/scripts/run_targeted_tests.py

      - name: Export remaining failures
        if: failure() && steps.tests.outcome == 'failure'
        run: python .github/scripts/export_failed_tests.py

      - name: Preserve remaining failures
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .test-results/failed-tests.txt
          if-no-files-found: ignore
          retention-days: 7
