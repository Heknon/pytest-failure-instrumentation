name: Portability

permissions:
  contents: read
  actions: read

on:
  # A workflow_dispatch workflow must already exist on the default branch.
  # The label trigger makes the pre-merge full gate available even on the PR
  # that introduces this workflow: apply the `full-portability` label.
  pull_request:
    types: [labeled]
  # One complete cross-platform sweep per week catches platform drift without
  # charging every PR commit for four full non-Linux jobs.
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      platform:
        description: Runner to validate
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
      python-version:
        description: Python version for a targeted run
        required: true
        type: choice
        default: "3.13"
        options:
          - "3.9"
          - "3.11"
          - "3.13"
      tests:
        description: "Optional pytest node IDs, one per line; blank runs the full suite"
        required: false
        type: string
      failed-run-id:
        description: "Optional prior Actions run ID; reruns that platform's recorded failures"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name != 'full-portability' && github.event.label.name || 'active' }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'schedule' || github.event.label.name == 'full-portability' || inputs.platform == 'all' || inputs.platform == 'macos'
    name: macos / ${{ (inputs.tests || inputs.failed-run-id) && 'targeted' || 'full' }} / py${{ inputs.python-version || '3.13' }}
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,client]"
      - name: Download failures from prior run
        if: github.event_name == 'workflow_dispatch' && inputs.failed-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: failed-tests-macOS-py${{ inputs.python-version }}
          path: .prior-failures
          repository: ${{ github.repository }}
          run-id: ${{ inputs.failed-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run full suite
        id: tests
        if: github.event_name != 'workflow_dispatch' || (inputs.tests == '' && inputs.failed-run-id == '')
        run: pytest -q
      - name: Run targeted tests
        id: targeted-tests
        if: github.event_name == 'workflow_dispatch' && (inputs.tests != '' || inputs.failed-run-id != '')
        env:
          TARGET_TESTS: ${{ inputs.tests }}
          TARGET_TESTS_FILE: ${{ inputs.failed-run-id != '' && '.prior-failures/failed-tests.txt' || '' }}
        run: python .github/scripts/run_targeted_tests.py
      - name: Export failed test IDs
        if: failure() && (steps.tests.outcome == 'failure' || steps.targeted-tests.outcome == 'failure')
        run: python .github/scripts/export_failed_tests.py
      - name: Preserve failed test IDs
        if: failure() && (steps.tests.outcome == 'failure' || steps.targeted-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-macOS-py${{ inputs.python-version || '3.13' }}
          path: .test-results/failed-tests.txt
          if-no-files-found: ignore
          retention-days: 7

  windows:
    if: github.event_name == 'schedule' || github.event.label.name == 'full-portability' || inputs.platform == 'all' || inputs.platform == 'windows'
    name: windows / ${{ (inputs.tests || inputs.failed-run-id) && 'targeted' || 'full' }} / py${{ inputs.python-version || '3.13' }}
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,client]"
      - name: Download failures from prior run
        if: github.event_name == 'workflow_dispatch' && inputs.failed-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: failed-tests-Windows-py${{ inputs.python-version }}
          path: .prior-failures
          repository: ${{ github.repository }}
          run-id: ${{ inputs.failed-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run full suite
        id: tests
        if: github.event_name != 'workflow_dispatch' || (inputs.tests == '' && inputs.failed-run-id == '')
        run: pytest -q
      - name: Run targeted tests
        id: targeted-tests
        if: github.event_name == 'workflow_dispatch' && (inputs.tests != '' || inputs.failed-run-id != '')
        env:
          TARGET_TESTS: ${{ inputs.tests }}
          TARGET_TESTS_FILE: ${{ inputs.failed-run-id != '' && '.prior-failures/failed-tests.txt' || '' }}
        run: python .github/scripts/run_targeted_tests.py
      - name: Export failed test IDs
        if: failure() && (steps.tests.outcome == 'failure' || steps.targeted-tests.outcome == 'failure')
        run: python .github/scripts/export_failed_tests.py
      - name: Preserve failed test IDs
        if: failure() && (steps.tests.outcome == 'failure' || steps.targeted-tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-Windows-py${{ inputs.python-version || '3.13' }}
          path: .test-results/failed-tests.txt
          if-no-files-found: ignore
          retention-days: 7

  # Validate the oldest Windows release cell before tagging, without adding
  # another full suite to every PR commit. The regression label runs only
  # kill attribution; the final portability label verifies the complete wheel.
  windows39-wheel:
    if: github.event.label.name == 'windows39-regression' || github.event.label.name == 'full-portability'
    name: windows wheel / py3.9 / ${{ github.event.label.name == 'full-portability' && 'full' || 'targeted' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install "$(ls dist/*.whl)[test,client]"
          python -c "import pytest_failure_instrumentation as p; assert 'site-packages' in p.__file__, p.__file__"
      - name: Run Windows kill attribution regression
        if: github.event.label.name == 'windows39-regression'
        run: pytest -q tests/test_kill_attribution.py tests/test_kill_readiness.py
      - name: Run full wheel suite
        if: github.event.label.name == 'full-portability'
        run: pytest -q
